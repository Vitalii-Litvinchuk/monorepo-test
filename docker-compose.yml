version: '3.8'

# ==============================================================================
# Docker Compose for dzencode Monorepo
# Image: advanceddocker/monorepo-test:tagname
# Subpath: /test
# ==============================================================================

services:
  # Option 1: All-In-One Service (Recommended for simple Portainer & Single Host deployment)
  inventory-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_PATH=/test
    image: advanceddocker/monorepo-test:tagname
    container_name: dzencode_monorepo_app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/test
      - BASE_PATH=/test
      - FRONTEND_URL=http://localhost:3000/test
      - API_INTERNAL_URL=http://localhost:4000
      - PORT=3000
      - API_PORT=4000
      - DB_PATH=/app/data/inventory.sqlite
      - UPLOADS_DIR=/app/data/uploads
      - JWT_SECRET=dzencode-enterprise-production-jwt-secret-2026
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-mock-google-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-mock-google-client-secret}
      - GOOGLE_CALLBACK_URL=http://localhost:3000/test/api/auth/google/callback
      - NEXT_PUBLIC_WS_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_PATH=/test/socket.io
    volumes:
      - inventory_data:/app/data

volumes:
  inventory_data:
    name: dzencode_inventory_data
