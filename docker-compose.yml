version: '3.8'

# ==============================================================================
# Docker Compose: Inventory Orders & Products (Relative Subpaths)
# Frontend: /test-web (:3000)
# Backend:  /test-api (:4000)
# ==============================================================================

services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: /test-web
        API_URL: /test-api
    image: advanceddocker/monorepo-test:v.1
    container_name: inventory_api
    restart: unless-stopped
    command: ["api"]
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - API_BASE_PATH=/test-api
      - FRONTEND_URL=/test-web
      - DB_PATH=/app/data/inventory.sqlite
      - UPLOADS_DIR=/app/data/uploads
      - JWT_SECRET=dzencode-enterprise-production-jwt-secret-2026
      - GOOGLE_CLIENT_ID=mock-google-client-id.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=mock-google-client-secret
      - GOOGLE_CALLBACK_URL=http://localhost:4000/test-api/api/auth/google/callback
    volumes:
      - inventory_data:/app/data

  inventory-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: /test-web
        API_URL: /test-api
    image: advanceddocker/monorepo-test:v.1
    container_name: inventory_web
    restart: unless-stopped
    command: ["web"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_BASE_PATH=/test-web
      - BASE_PATH=/test-web
      - NEXT_PUBLIC_API_URL=/test-api
      - NEXT_PUBLIC_WS_PATH=/test-api/socket.io
      - API_INTERNAL_URL=http://inventory-api:4000
    depends_on:
      - inventory-api
    volumes:
      - inventory_data:/app/data

volumes:
  inventory_data:
    name: inventory_monorepo_data
    driver: local
