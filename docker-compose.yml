version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dzencode_api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_PATH=/app/inventory.sqlite
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=dzencode-super-secret-jwt-key-2026
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-mock-google-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-mock-google-client-secret}
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - sqlite_data:/app
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dzencode_web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:4000
      - NEXT_PUBLIC_WS_URL=http://localhost:4000
    depends_on:
      - api

volumes:
  sqlite_data:
  uploads_data:
